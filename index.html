<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Memory game</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,700;1,14..32,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script
      src="./script.js"
      type="module"
      defer
    ></script>
  </head>
  <body>
    <div class="game-area" id="area">
      <div class="control-panel">
        <div class="output-group">
          <output>Moves: 20</output>
          <output>Timer: 30 sec</output>
        </div>
        <button class="reset-button">
          Reset
        </button>
      </div>
      <div class="cards-map" id="map"></div>
    </div>
  </body>
</html>
